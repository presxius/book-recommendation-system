<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekomendasi Buku - SVD</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Rekomendasi Buku Untuk Anda</h1>
            <p>Berdasarkan preferensi membaca Anda</p>
        </header>

        <div class="main-content">
            <div id="recommendationsList" class="recommendations-grid">
                <!-- Recommendations will be populated by JavaScript -->
            </div>

            <div class="actions">
                <button onclick="goBack()" class="btn-secondary">Kembali ke Pemilihan Buku</button>
                <button onclick="newSearch()" class="btn-primary">Cari Buku Lain</button>
            </div>
        </div>
    </div>

    <script>
        function loadRecommendations() {
            const recommendations = JSON.parse(sessionStorage.getItem('recommendations') || '[]');
            const container = document.getElementById('recommendationsList');

            if (recommendations.length === 0) {
                container.innerHTML = '<p>Tidak ada rekomendasi yang tersedia.</p>';
                return;
            }

            container.innerHTML = recommendations.map(book => `
                <div class="recommendation-card">
                    <div class="book-header">
                        <h3>${book.Title}</h3>
                        <span class="predicted-rating">${book.Predicted_Rating}/10</span>
                    </div>
                    <div class="book-details">
                        <p><strong>Penulis:</strong> ${book.Author}</p>
                        <p><strong>Tahun:</strong> ${book.Year}</p>
                        <p><strong>Penerbit:</strong> ${book.Publisher}</p>
                        <p><strong>ISBN:</strong> ${book.ISBN}</p>
                    </div>
                </div>
            `).join('');
        }

        function goBack() {
            window.history.back();
        }

        function newSearch() {
            sessionStorage.removeItem('recommendations');
            window.location.href = '/';
        }

        // Load recommendations when page loads
        document.addEventListener('DOMContentLoaded', loadRecommendations);
    </script>
</body>
</html>
